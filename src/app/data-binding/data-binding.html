<div class="text-center">
    <b>1. Interpolation</b>
    <p>{{ name }}</p>

    <b>2. Property Binding</b><br />
    <input type="text" [value]="topic" />

    <div class="h-50 w-50 border border-black p-2 mx-auto">
        <img [src]="image" alt="House Image" class="w-full h-full object-cover"/>
    </div>

    <b>3. Event Binding</b><br />
    <button class="text-white bg-blue-500 hover:bg-blue-700 font-bold py-2 px-4 rounded" 
        (click)="OnSubmitClick()">Submit</button>

    <div class="p-2">
        <select class="w-50 bg-gray-400 text-white text-sm cursor-pointer" 
         (change)="onCountryChange()">
            <option value="">Select Country</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="Germany">Germany</option>
            <option value="France">France</option>
        </select>
    </div>  
    <b>4. Two way Binding</b><br />
    <div class="p-2">
        <input type="text" [(ngModel)]="name" class="border border-black p-1" />
        <p class="text-lg">{{ name }}</p>
    </div>

</div>

<div class="class border-2 border-dashed border-gray-500 m-4">
    <div class="h-100 flex flex-col items-center justify-center text-center font-mono">
        <h2 class="class text-3xl text-red-500 mb-10">
            Signal Component
        </h2>
        <h2 class="class text-3xl font-bold">Count : {{count()}}</h2>

        <button class="bg-blue-500 text-white rounded px-3 py-1 m-2" (click)="incrementCount()">Increment</button>
        <button class="bg-green-500 text-white rounded px-3 py-1 m-2" (click)="decrementCount()">Decrement</button>
        <button class="bg-red-500 text-white rounded px-3 py-1 m-2" (click)="resetCount()">Reset</button>
    </div>
</div>

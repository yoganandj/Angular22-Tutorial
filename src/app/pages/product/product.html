<div class="max-w-4xl mx-auto p-6">
  <div class="flex items-center justify-between border-b pb-4 mb-6">
    <h2 class="text-3xl font-bold text-gray-800">Product List</h2>
    <span class="text-sm text-gray-500 font-medium">{{ products.length }} items available</span>
  </div>

  <nav aria-label="Product list navigation">
    <ul class="flex flex-col gap-3">
      @for (product of products; track product.id) {
        <li>
          <!-- <a
            /* Using Router Link to navigate to the product details page with the product ID as a route parameter */
            [routerLink]="['/pages/product-details', product.id]"
            class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-lg shadow-xs hover:shadow-md hover:border-blue-500 hover:bg-blue-50 transition duration-150 group"
          > -->
            <button (click)="viewProductDetails(product.id)">View Details
            <div class="flex items-center gap-4">
              <span class="flex items-center justify-center w-10 h-10 rounded-full bg-blue-100 text-blue-600 font-bold text-sm group-hover:bg-blue-600 group-hover:text-white transition duration-150">
                #{{ product.id }}
              </span>
              <div>
                <h3 class="text-lg font-semibold text-gray-900 group-hover:text-blue-600 transition duration-150">
                  {{ product.name }}
                </h3>
                <p class="text-sm text-gray-500">{{ product.description }}</p>
                <span class="inline-block mt-1 text-xs px-2 py-0.5 rounded bg-gray-100 text-gray-600">
                  {{ product.category }}
                </span>
              </div>
            </div>

            <div class="flex items-center gap-6">
              <span class="text-xl font-bold text-green-600">${{ product.price }}</span>
              <span class="text-blue-600 text-sm font-semibold group-hover:translate-x-1 transition duration-150">
                View &rarr;
              </span>
            </div>
            </button>
          <!-- </a> -->
        </li>
      }
    </ul>
  </nav>
</div>
